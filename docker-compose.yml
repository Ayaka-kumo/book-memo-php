version: "3.8"

services:
  app:
    image: php:8.2-apache
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: book_memo
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"

  adminer:
    image: adminer
    ports:
      - "8080:8080"
